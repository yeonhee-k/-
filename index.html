<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GO climb</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * { box-sizing: border-box; }

    :root {
      --blue: #2563eb;
      --navy: #172b4d;
      --muted: #718096;
      --line: #e8edf4;
      --bg: #f5f8fc;
    }

    body {
      margin: 0;
      font-family: "Malgun Gothic", Arial, sans-serif;
      color: var(--navy);
      background: var(--bg);
    }

    header {
      min-height: 84px;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: white;
      border-bottom: 1px solid var(--line);
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 23px;
      letter-spacing: -1px;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .layout {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      height: calc(100vh - 84px);
      min-height: 500px;
    }

    .sidebar {
      padding: 22px 18px;
      overflow-y: auto;
      background: white;
      border-right: 1px solid var(--line);
    }

    #search {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #dce4ef;
      border-radius: 14px;
      outline: none;
      font-size: 14px;
    }

    #search:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px #2563eb18;
    }

    #count {
      margin: 20px 2px 12px;
      font-size: 13px;
      color: var(--muted);
    }

    .gym {
      padding: 18px 12px;
      margin: 0 -6px 8px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
    }

    .gym:hover {
      border-color: #bfd2ff;
      box-shadow: 0 5px 18px #243b530b;
    }

    .gym h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .gym p {
      margin: 7px 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .gym button {
      width: 100%;
      margin-top: 10px;
      padding: 11px;
      border: 0;
      border-radius: 9px;
      background: #edf4ff;
      color: var(--blue);
      font-weight: 700;
      cursor: pointer;
    }

    .gym button:hover {
      background: var(--blue);
      color: white;
    }

    .facility-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
    }

    .facility-tag {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 6px;
      background: #edf4ff;
      color: #2563eb;
      font-size: 11px;
      font-weight: 700;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 500px;
      background: #e7f0fa;
      z-index: 1;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 12px;
    }

    .leaflet-popup-content {
      font-size: 13px;
      line-height: 1.7;
    }

    .gym-popup h3 {
      margin: 0 0 6px;
      font-size: 16px;
    }

    .gym-popup p {
      margin: 5px 0;
    }

    .gym-filter-panel {
      width: 205px;
      padding: 14px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      color: #243047;
      font-size: 13px;
    }

    .gym-filter-panel h3 {
      margin: 0 0 10px;
      font-size: 15px;
    }

    .gym-filter-panel label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
      cursor: pointer;
    }

    .gym-filter-panel input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #3978f6;
      cursor: pointer;
    }

    .gym-filter-panel button {
      width: 100%;
      margin-top: 8px;
      padding: 9px;
      border: none;
      border-radius: 8px;
      background: #edf3ff;
      color: #2864df;
      font-weight: bold;
      cursor: pointer;
    }

    .gym-filter-panel button:hover {
      background: #dce8ff;
    }

    @media (max-width: 700px) {
      header {
        min-height: auto;
        padding: 18px;
        align-items: flex-start;
        flex-direction: column;
      }

      header h1 { font-size: 20px; }

      .layout {
        display: flex;
        flex-direction: column;
        height: auto;
        min-height: 0;
      }

      #map {
        order: 1;
        height: 55vh;
        min-height: 360px;
      }

      .sidebar {
        order: 2;
        padding: 16px;
        overflow: visible;
        border-right: 0;
      }

      .gym-filter-panel { width: 190px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Go climb</h1>
    <p>내가 가고 싶은 클라이밍 암장을 찾아보세요.</p>
  </header>

  <main class="layout">
    <section class="sidebar">
      <input id="search" type="search" placeholder="암장 이름 또는 지역 검색">
      <p id="count"></p>
      <div id="gym-list"></div>
    </section>

    <div id="map"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. 지도 생성
    const map = L.map("map").setView([36.5, 127.8], 7);

    L.tileLayer(
  "https://basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png?key=cb1_4l07_1_83499e6c83816a4c71e568a7",
  {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    maxZoom: 19
  }
).addTo(map);


    // 2. 암장 데이터
    const gyms = [
      {
        id: 1,
        name: "온플릭클라이밍짐 천호점",
        region: "서울",
        type: "볼더링",
        address: "서울 강동구 올림픽로 664 대우한강베네시티 상가 지하 1층",
        lat: 37.540688,
        lng: 127.124562,
        kilterboard: false,
        moonboard2016: false,
        moonboard2024: true,
        shower: false,
        operating: true,
        hours: "평일 10:00~23:00 / 주말 10:00~20:00",
        price: "1일 이용권 20,000원"
      },
      {
        id: 2,
        name: "서울숲클라이밍 종로점",
        region: "서울",
        type: "볼더링",
        address: "서울 종로구 수표로 96 지하1층",
        lat: 37.569688,
        lng: 126.989937,
        kilterboard: false,
        moonboard2016: false,
        moonboard2024: true,
        shower: false,
        operating: true,
        hours: "평일 07:00~23:00 / 주말 09:00~21:00",
        price: "1일 이용권 20,000원",
      },
{
        id: 3,
        name: "을지로 담장 클라이밍",
        region: "서울",
        type: "볼더링",
        address: "서울 중구 마른내로 63-3 2F",
        lat: 37.564563,
        lng: 126.995063,
        kilterboard: false,
        moonboard2016: true,
        moonboard2024: false,
        shower: false,
        operating: true,
        hours: "평일 11:00~23:00 / 주말 10:00~18:00",
        price: "1일 이용권 20,000원",
},
{
        id: 4,
        name: "훅클라이밍 왕십리점",
        region: "서울",
        type: "볼더링",
        address: "서울 성동구 고산자로6길 40 2층 훅클라이밍",
        lat: 37.558312,
        lng: 127.035188,
        kilterboard: false,
        moonboard2016: false,
        moonboard2024: true,
        shower: false,
        operating: true,
        hours: "평일 10:00~23:00 / 주말 10:00~20:00",
        price: "1일 이용권 20,000원",
      },
    ];

    // 표시할 시설 정보
    const features = [
      { key: "kilterboard", label: "킬터보드" },
      { key: "moonboard2016", label: "문보드 2016" },
      { key: "moonboard2024", label: "문보드 2024" },
      { key: "shower", label: "샤워부스" },
      { key: "operating", label: "현재 운영" }
    ];

    // true인 항목만 태그로 표시
    function createFeatureTags(gym) {
      return features
        .filter(feature => gym[feature.key] === true)
        .map(feature =>
          `<span class="facility-tag">${feature.label}</span>`
        )
        .join("");
    }

    // 3. 필터 패널
    const filterControl = L.control({ position: "topright" });

    filterControl.onAdd = function () {
      const div = L.DomUtil.create("div", "gym-filter-panel");

      div.innerHTML = `
        <h3>암장 필터</h3>
        <label><input type="checkbox" id="filter-kilter"> 킬터보드 </label>
        <label><input type="checkbox" id="filter-moon2016"> 문보드 2016 </label>
        <label><input type="checkbox" id="filter-moon2024"> 문보드 2024 </label>
        <label><input type="checkbox" id="filter-shower"> 샤워부스 </label>
        <label><input type="checkbox" id="filter-operating"> 현재 운영 중</label>
        <button type="button" id="reset-gym-filters">필터 초기화</button>
      `;

      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);

      return div;
    };

    filterControl.addTo(map);

    // 4. 마커 팝업
    function createGymPopup(gym) {
      return `
        <div class="gym-popup">
          <h3>${gym.name}</h3>
          <p>📍 ${gym.address || gym.region}</p>
          <hr>
          <p><strong>암장 유형:</strong> ${gym.type || "정보 없음"}</p>
          <div class="facility-tags">
            ${createFeatureTags(gym)}
          </div>
          <p><strong>이용시간:</strong> ${gym.hours || "정보 없음"}</p>
          <p><strong>이용요금:</strong> ${gym.price || "정보 없음"}</p>
          ${gym.memo ? `<p><strong>추가 정보:</strong> ${gym.memo}</p>` : ""}
        </div>
      `;
    }

    // 모든 암장에 마커 생성
    const markers = gyms.map(gym => {
      const marker = L.marker([gym.lat, gym.lng])
        .bindPopup(createGymPopup(gym));

      return { gym, marker };
    });

    // 5. 검색 및 필터
    const search = document.getElementById("search");
    const gymList = document.getElementById("gym-list");
    const count = document.getElementById("count");

    const filterIds = [
      "filter-kilter",
      "filter-moon2016",
      "filter-moon2024",
      "filter-shower",
      "filter-operating"
    ];

    function getVisibleGyms() {
      const keyword = search.value.trim().toLowerCase();

      const filters = {
        kilterboard: document.getElementById("filter-kilter").checked,
        moonboard2016: document.getElementById("filter-moon2016").checked,
        moonboard2024: document.getElementById("filter-moon2024").checked,
        shower: document.getElementById("filter-shower").checked,
        operating: document.getElementById("filter-operating").checked
      };

      return gyms.filter(gym => {
        const searchableText = [
          gym.name,
          gym.region,
          gym.type,
          gym.address
        ].join(" ").toLowerCase();

        const matchesSearch = searchableText.includes(keyword);

        const matchesFilters =
          (!filters.kilterboard || gym.kilterboard === true) &&
          (!filters.moonboard2016 || gym.moonboard2016 === true) &&
          (!filters.moonboard2024 || gym.moonboard2024 === true) &&
          (!filters.shower || gym.shower === true) &&
          (!filters.operating || gym.operating === true);

        return matchesSearch && matchesFilters;
      });
    }

    // 6. 왼쪽 리스트와 지도 마커 갱신
    function renderGyms() {
      const visibleGyms = getVisibleGyms();

      gymList.replaceChildren();
      count.textContent = `검색 결과 ${visibleGyms.length}곳`;

      visibleGyms.forEach(gym => {
        const item = document.createElement("article");
        item.className = "gym";

        const title = document.createElement("h3");
        title.textContent = gym.name;

        const region = document.createElement("p");
        region.textContent = `📍 ${gym.region || gym.address || "지역 정보 없음"}`;

        const type = document.createElement("p");
        type.textContent = `암장 유형: ${gym.type || "정보 없음"}`;

        const facilityBox = document.createElement("div");
        facilityBox.className = "facility-tags";
        facilityBox.innerHTML = createFeatureTags(gym);

        const button = document.createElement("button");
        button.textContent = "지도에서 위치 보기";

        button.addEventListener("click", () => {
          map.setView([gym.lat, gym.lng], 15);

          const target = markers.find(
            item => item.gym.id === gym.id
          );

          if (target) {
            target.marker.openPopup();
          }
        });

        item.append(title, region, type, facilityBox, button);
        gymList.appendChild(item);
      });

      // 검색 및 필터 결과에 맞게 마커 표시
      markers.forEach(({ gym, marker }) => {
        if (visibleGyms.includes(gym)) {
          if (!map.hasLayer(marker)) {
            marker.addTo(map);
          }
        } else {
          if (map.hasLayer(marker)) {
            map.removeLayer(marker);
          }
        }
      });
    }

    // 검색 이벤트
    search.addEventListener("input", renderGyms);

    // 필터 이벤트
    filterIds.forEach(id => {
      document.getElementById(id)
        .addEventListener("change", renderGyms);
    });

    // 필터 초기화
    document.getElementById("reset-gym-filters")
      .addEventListener("click", () => {
        filterIds.forEach(id => {
          document.getElementById(id).checked = false;
        });

        renderGyms();
      });

    // 최초 실행
    renderGyms();

    // 모바일 화면에서도 지도 크기가 맞도록 조정
    window.addEventListener("resize", () => {
      map.invalidateSize();
    });
  </script>
</body>
</html>
